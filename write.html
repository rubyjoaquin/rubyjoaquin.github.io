<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Post helper</title>
<style>
:root{--bg:#EEF2F1;--ink:#14211F;--muted:#4A5B58;--line:#CBD6D3;--accent:#0F6B63;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1615;--ink:#E6EEEC;--muted:#A3B5B1;--line:#2A3B39;--accent:#4FD1C0;}}
:root[data-theme="dark"]{--bg:#0E1615;--ink:#E6EEEC;--muted:#A3B5B1;--line:#2A3B39;--accent:#4FD1C0;}
*{box-sizing:border-box;}
body{margin:0 auto;max-width:720px;padding:24px;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;}
label{display:block;font-weight:600;margin:16px 0 4px;}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 10px;}
textarea{min-height:180px;}
button{margin-top:16px;font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:10px 18px;cursor:pointer;}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
.hint{color:var(--muted);font-size:15px;}
#out{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;}
</style>
</head>
<body>
<h1>Post helper</h1>
<p class="hint">This page only formats your post. It doesn’t save or send anything. Fill it in, copy the snippet, then paste it at the top of the list in posts.js on GitHub and commit.</p>
<label for="t">Title</label><input id="t">
<label for="d">Date</label><input id="d" type="date">
<label for="s">One-line summary</label><input id="s">
<label for="b">Post (leave a blank line between paragraphs)</label><textarea id="b"></textarea>
<button id="go" type="button">Make snippet</button>
<label for="out">Snippet to paste into posts.js</label>
<textarea id="out" readonly></textarea>
<button id="copy" type="button">Copy snippet</button>
<script>
var d = document.getElementById("d"); d.value = new Date().toISOString().slice(0,10);
document.getElementById("go").addEventListener("click", function(){
  var post = { title: document.getElementById("t").value.trim(), date: d.value, summary: document.getElementById("s").value.trim(), body: document.getElementById("b").value.trim() };
  document.getElementById("out").value = JSON.stringify(post, null, 2).replace(/^/gm, "  ") + ",";
});
document.getElementById("copy").addEventListener("click", function(){
  var o = document.getElementById("out"); o.select();
  if(navigator.clipboard){ navigator.clipboard.writeText(o.value); } else { document.execCommand("copy"); }
});
</script>
</body>
</html>
